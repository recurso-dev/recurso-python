# No-network CI for the generated SDK: install, run the signature smoke test,
# then the pytest suite (which includes an httpx.MockTransport round-trip).
# The package requires Python 3.11+ (models parse RFC 3339 "Z" timestamps via
# datetime.fromisoformat, which 3.10 rejects, and pyproject pins ^3.11), so the
# matrix starts at 3.11.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: python tests/smoke_test.py
      - run: python -m pytest -q
